services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cryptohawk
      POSTGRES_USER: cryptohawk
      POSTGRES_PASSWORD: cryptohawk-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptohawk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cryptohawk-db:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      CRYPTOHAWK_DATABASE_URL: postgresql+psycopg://cryptohawk:cryptohawk-dev@db:5432/cryptohawk
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      CRYPTOHAWK_DATABASE_URL: postgresql+psycopg://cryptohawk:cryptohawk-dev@db:5432/cryptohawk
      CRYPTOHAWK_CORS_ORIGINS: http://localhost:3000
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: "false"
      CRYPTOHAWK_CONTAINER_ARCHIVE_ROOT: /var/lib/cryptohawk/images
    volumes:
      - ${CRYPTOHAWK_CONTAINER_ARCHIVE_HOST_PATH:-./container-images}:/var/lib/cryptohawk/images:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    build: .
    command:
      - cryptohawk
      - worker
      - --worker-id
      - docker-worker-1
      - --lease-seconds
      - "60"
    environment:
      CRYPTOHAWK_DATABASE_URL: postgresql+psycopg://cryptohawk:cryptohawk-dev@db:5432/cryptohawk
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: "false"
      CRYPTOHAWK_CONTAINER_ARCHIVE_ROOT: /var/lib/cryptohawk/images
    volumes:
      - ${CRYPTOHAWK_CONTAINER_ARCHIVE_HOST_PATH:-./container-images}:/var/lib/cryptohawk/images:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: .
    command:
      - cryptohawk
      - scheduler
      - --poll-interval
      - "5"
      - --batch-size
      - "100"
    environment:
      CRYPTOHAWK_DATABASE_URL: postgresql+psycopg://cryptohawk:cryptohawk-dev@db:5432/cryptohawk
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  cryptohawk-db:
