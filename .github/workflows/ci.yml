name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests migrations scripts
      - run: pytest --cov=cryptohawk --cov-report=term-missing
      - name: Audit Python dependencies
        run: |
          set +e
          pip-audit --format=json --output pip-audit.json
          status=$?
          if [ -f pip-audit.json ]; then
            cat pip-audit.json
          fi
          exit "$status"
      - name: Preserve Python dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  release-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cryptohawk_release
          POSTGRES_USER: cryptohawk
          POSTGRES_PASSWORD: cryptohawk-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptohawk -d cryptohawk_release"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CRYPTOHAWK_ENVIRONMENT: production
      CRYPTOHAWK_DATABASE_URL: postgresql+psycopg://cryptohawk:cryptohawk-ci@127.0.0.1:5432/cryptohawk_release
      CRYPTOHAWK_CORS_ORIGINS: https://cryptohawk.example.invalid
      CRYPTOHAWK_ALLOW_LEGACY_GLOBAL_API: 'false'
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Configure ephemeral production connector key
        run: |
          key=$(python -c 'from cryptohawk.security.secrets import VersionedAesGcmCipher; print(VersionedAesGcmCipher.generate_key())')
          echo "CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS=1:${key}" >> "$GITHUB_ENV"
          echo "CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION=1" >> "$GITHUB_ENV"
      - name: Migrate release database
        run: alembic upgrade head
      - name: Exercise Discover-Assess-Migrate-Prove release path
        run: python scripts/release_qualification.py

  postgres-dr:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cryptohawk_source
          POSTGRES_USER: cryptohawk
          POSTGRES_PASSWORD: cryptohawk-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptohawk -d cryptohawk_source"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SOURCE_APP_URL: postgresql+psycopg://cryptohawk:cryptohawk-ci@127.0.0.1:5432/cryptohawk_source
      SOURCE_PG_URL: postgresql://cryptohawk:cryptohawk-ci@127.0.0.1:5432/cryptohawk_source
      RESTORE_APP_URL: postgresql+psycopg://cryptohawk:cryptohawk-ci@127.0.0.1:5432/cryptohawk_restored
      RESTORE_PG_URL: postgresql://cryptohawk:cryptohawk-ci@127.0.0.1:5432/cryptohawk_restored
      ADMIN_PG_URL: postgresql://cryptohawk:cryptohawk-ci@127.0.0.1:5432/postgres
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Configure ephemeral connector encryption key
        run: |
          key=$(python -c 'from cryptohawk.security.secrets import VersionedAesGcmCipher; print(VersionedAesGcmCipher.generate_key())')
          echo "CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS=1:${key}" >> "$GITHUB_ENV"
          echo "CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION=1" >> "$GITHUB_ENV"
      - name: Migrate source database
        env:
          CRYPTOHAWK_DATABASE_URL: ${{ env.SOURCE_APP_URL }}
        run: alembic upgrade head
      - name: Seed representative CryptoHawk state
        env:
          CRYPTOHAWK_DATABASE_URL: ${{ env.SOURCE_APP_URL }}
        run: |
          mkdir -p .dr
          python scripts/postgres_dr_fixture.py seed .dr/fixture.json
      - name: Create and validate PostgreSQL 17 custom backup
        run: |
          docker pull postgres:17
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e CRYPTOHAWK_POSTGRES_URL="$SOURCE_PG_URL" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:17 \
            bash scripts/postgres_backup.sh .dr/cryptohawk.dump
      - name: Create pristine restore database
        run: |
          docker run --rm --network host postgres:17 \
            psql "$ADMIN_PG_URL" --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE cryptohawk_restored TEMPLATE template0;"
      - name: Restore backup into clean database
        run: |
          docker run --rm --network host \
            -e CRYPTOHAWK_POSTGRES_URL="$RESTORE_PG_URL" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:17 \
            bash scripts/postgres_restore.sh .dr/cryptohawk.dump
      - name: Verify restored CryptoHawk invariants
        env:
          CRYPTOHAWK_DATABASE_URL: ${{ env.RESTORE_APP_URL }}
        run: python scripts/postgres_dr_fixture.py verify .dr/fixture.json
      - name: Prove restore refuses a non-empty target
        run: |
          if docker run --rm --network host \
            -e CRYPTOHAWK_POSTGRES_URL="$RESTORE_PG_URL" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:17 \
            bash scripts/postgres_restore.sh .dr/cryptohawk.dump; then
            echo "restore unexpectedly accepted a non-empty target" >&2
            exit 1
          fi
      - name: Prove corrupted backups are rejected
        run: |
          cp .dr/cryptohawk.dump .dr/tampered.dump
          sed 's/cryptohawk.dump/tampered.dump/' \
            .dr/cryptohawk.dump.sha256 > .dr/tampered.dump.sha256
          printf 'tampered' >> .dr/tampered.dump
          if docker run --rm --network host \
            -e CRYPTOHAWK_POSTGRES_URL="$RESTORE_PG_URL" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:17 \
            bash scripts/postgres_restore.sh .dr/tampered.dump; then
            echo "restore unexpectedly accepted a corrupted backup" >&2
            exit 1
          fi
      - name: Remove ephemeral DR secrets and archives
        if: always()
        run: rm -rf .dr

  postgres-load-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cryptohawk_load
          POSTGRES_USER: cryptohawk
          POSTGRES_PASSWORD: cryptohawk-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptohawk -d cryptohawk_load"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CRYPTOHAWK_DATABASE_URL: postgresql+psycopg://cryptohawk:cryptohawk-ci@127.0.0.1:5432/cryptohawk_load
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Migrate load database
        run: alembic upgrade head
      - name: Exercise sustained multi-tenant queue churn
        run: >-
          timeout 180s python scripts/postgres_load_soak.py
          --workspaces 4
          --assets-per-workspace 40
          --rounds 5
          --workers 8
          --concurrency-per-workspace 4
          --retry-every 20

  postgres-failure-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cryptohawk_failure
          POSTGRES_USER: cryptohawk
          POSTGRES_PASSWORD: cryptohawk-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptohawk -d cryptohawk_failure"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CRYPTOHAWK_DATABASE_URL: postgresql+psycopg://cryptohawk:cryptohawk-ci@127.0.0.1:5432/cryptohawk_failure
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Migrate failure-injection database
        run: alembic upgrade head
      - name: Inject worker, network and database failures
        run: |
          postgres_container=$(docker ps \
            --filter 'ancestor=postgres:17' \
            --format '{{.ID}}' | head -n 1)
          if [ -z "$postgres_container" ]; then
            echo "PostgreSQL service container was not found" >&2
            exit 1
          fi
          timeout 180s python scripts/postgres_failure_injection.py \
            --database-url "$CRYPTOHAWK_DATABASE_URL" \
            --postgres-container "$postgres_container"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
