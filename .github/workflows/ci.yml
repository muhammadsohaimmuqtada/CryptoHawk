name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests migrations
      - run: pytest --cov=cryptohawk --cov-report=term-missing
      - name: Audit Python dependencies
        run: |
          set +e
          pip-audit --format=json --output pip-audit.json
          status=$?
          if [ -f pip-audit.json ]; then
            cat pip-audit.json
          fi
          exit "$status"
      - name: Preserve Python dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Preserve generated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          retention-days: 1
      - run: npm audit --audit-level=high
      - run: npm run build
