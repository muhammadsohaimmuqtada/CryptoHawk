name: Quota test cleanup
on:
  push:
    branches: [agent/quotas-concurrency]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quotas-concurrency
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_quotas.py')
          text = path.read_text()
          old = '    url, inventory, quota, queue, alpha, alpha_asset = _inventory(tmp_path)\n'
          new = '    _, inventory, _quota, queue, alpha, alpha_asset = _inventory(tmp_path)\n'
          if old not in text:
              raise SystemExit('quota test cleanup anchor not found')
          text = text.replace(old, new)
          text = text.replace('    assert url.startswith("sqlite:///")\n\n\n', '\n\n')
          path.write_text(text)
          Path('.github/workflows/quota-test-cleanup.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "clean quota regression test"
          git push origin HEAD:agent/quotas-concurrency
