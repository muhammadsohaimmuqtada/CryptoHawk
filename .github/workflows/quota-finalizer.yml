name: Quota exact-head finalizer
on:
  push:
    branches: [agent/quotas-concurrency]

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quotas-concurrency
          fetch-depth: 0
      - name: Absorb earlier one-shot helpers and finalize integration
        run: |
          sleep 15
          git fetch origin agent/quotas-concurrency
          git reset --hard origin/agent/quotas-concurrency
          python - <<'PY'
          from pathlib import Path

          def replace_if_missing(path: str, marker: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new))

          auth = Path('src/cryptohawk/api/auth.py')
          text = auth.read_text()
          if 'def get_quota_repository()' not in text:
              old = 'quota_repo = QuotaRepository(inventory)\nbearer = HTTPBearer(auto_error=False)\n'
              new = (
                  'bearer = HTTPBearer(auto_error=False)\n\n\n'
                  'def get_quota_repository() -> QuotaRepository:\n'
                  '    return QuotaRepository(auth_repo.inventory)\n'
              )
              if old not in text:
                  raise SystemExit('auth quota binding anchor missing')
              text = text.replace(old, new)
          text = text.replace(
              'decision = quota_repo.consume(',
              'decision = get_quota_repository().consume(',
          )
          auth.write_text(text)

          app = Path('src/cryptohawk/api/app.py')
          text = app.read_text()
          if 'import hashlib\n' not in text:
              text = text.replace(
                  'from __future__ import annotations\n\n',
                  'from __future__ import annotations\n\nimport hashlib\n',
              )
          if 'Query, Request, status' not in text:
              text = text.replace(
                  'from fastapi import Depends, FastAPI, HTTPException, Query, status\n',
                  'from fastapi import Depends, FastAPI, HTTPException, Query, Request, status\n',
              )
          if '    get_quota_repository,\n' not in text:
              text = text.replace(
                  '    get_current_principal,\n    inventory,\n',
                  '    get_current_principal,\n    get_quota_repository,\n    inventory,\n',
              )
          if 'from cryptohawk.domain.quotas import ScanCapacity\n' not in text:
              text = text.replace(
                  'from cryptohawk.domain.models import DashboardSummary, Finding\n',
                  'from cryptohawk.domain.models import DashboardSummary, Finding\n'
                  'from cryptohawk.domain.quotas import ScanCapacity\n',
              )
          if 'from cryptohawk.storage.quotas import ScanCapacityExceeded\n' not in text:
              text = text.replace(
                  'from cryptohawk.storage.queue import ScanQueueRepository\n',
                  'from cryptohawk.storage.queue import ScanQueueRepository\n'
                  'from cryptohawk.storage.quotas import ScanCapacityExceeded\n',
              )

          if 'def _enforce_rate_limit(' not in text:
              anchor = (
                  'def _require_scan_job(workspace_id: str, job_id: str) -> ScanJob:\n'
                  '    job = inventory.get_scan_job(workspace_id=workspace_id, job_id=job_id)\n'
                  '    if job is None:\n'
                  '        raise HTTPException(status_code=404, detail="scan job not found in workspace")\n'
                  '    return job\n\n\n'
              )
              helpers = anchor + (
                  'def _hashed_scope(*parts: str) -> str:\n'
                  '    material = "|".join(part.strip().lower() for part in parts)\n'
                  '    return hashlib.sha256(material.encode("utf-8")).hexdigest()\n\n\n'
                  'def _peer_host(request: Request) -> str:\n'
                  '    return request.client.host if request.client is not None else "unknown"\n\n\n'
                  'def _enforce_rate_limit(\n'
                  '    *,\n'
                  '    scope_key: str,\n'
                  '    action: str,\n'
                  '    limit: int,\n'
                  '    window_seconds: int,\n'
                  '    detail: str,\n'
                  ') -> None:\n'
                  '    decision = get_quota_repository().consume(\n'
                  '        scope_key=scope_key,\n'
                  '        action=action,\n'
                  '        limit=limit,\n'
                  '        window_seconds=window_seconds,\n'
                  '    )\n'
                  '    if decision.allowed:\n'
                  '        return\n'
                  '    raise HTTPException(\n'
                  '        status_code=429,\n'
                  '        detail=detail,\n'
                  '        headers={"Retry-After": str(max(1, decision.retry_after_seconds))},\n'
                  '    )\n\n\n'
                  'def _enforce_scan_submission(workspace_id: str) -> None:\n'
                  '    _enforce_rate_limit(\n'
                  '        scope_key=f"workspace:{workspace_id}",\n'
                  '        action="scan-submit",\n'
                  '        limit=settings.scan_submissions_per_minute,\n'
                  '        window_seconds=60,\n'
                  '        detail="workspace scan submission quota exceeded",\n'
                  '    )\n\n\n'
              )
              if anchor not in text:
                  raise SystemExit('app helper anchor missing')
              text = text.replace(anchor, helpers)

          if 'bootstrap attempt quota exceeded' not in text:
              old = 'def bootstrap(request: BootstrapRequest) -> IssuedToken:\n    try:\n'
              new = (
                  'def bootstrap(request: BootstrapRequest, http_request: Request) -> IssuedToken:\n'
                  '    _enforce_rate_limit(\n'
                  '        scope_key=f"bootstrap:{_hashed_scope(_peer_host(http_request))}",\n'
                  '        action="bootstrap",\n'
                  '        limit=settings.bootstrap_attempts_per_hour,\n'
                  '        window_seconds=3600,\n'
                  '        detail="bootstrap attempt quota exceeded",\n'
                  '    )\n'
                  '    try:\n'
              )
              if old not in text:
                  raise SystemExit('bootstrap anchor missing')
              text = text.replace(old, new)

          if 'login attempt quota exceeded' not in text:
              old = 'def login(request: LoginRequest) -> IssuedToken:\n    try:\n'
              new = (
                  'def login(request: LoginRequest, http_request: Request) -> IssuedToken:\n'
                  '    _enforce_rate_limit(\n'
                  '        scope_key=(\n'
                  '            f"login:{_hashed_scope(_peer_host(http_request), request.email)}"\n'
                  '        ),\n'
                  '        action="login",\n'
                  '        limit=settings.login_attempts_per_15_minutes,\n'
                  '        window_seconds=900,\n'
                  '        detail="login attempt quota exceeded",\n'
                  '    )\n'
                  '    try:\n'
              )
              if old not in text:
                  raise SystemExit('login anchor missing')
              text = text.replace(old, new)

          if text.count('_enforce_scan_submission(workspace_id)') < 2:
              sync_old = (
                  '    _require_workspace(workspace_id)\n'
                  '    try:\n'
                  '        job, findings = scan_jobs.run(\n'
              )
              if sync_old in text and '_enforce_scan_submission(workspace_id)' not in text[
                  text.index('def run_managed_scan'):text.index('def enqueue_managed_scan')
              ]:
                  text = text.replace(
                      sync_old,
                      '    _require_workspace(workspace_id)\n'
                      '    _enforce_scan_submission(workspace_id)\n'
                      '    try:\n'
                      '        job, findings = scan_jobs.run(\n',
                      1,
                  )
              queue_segment_start = text.index('def enqueue_managed_scan')
              queue_segment_end = text.index('def list_scan_jobs') if 'def list_scan_jobs' in text else len(text)
              if '_enforce_scan_submission(workspace_id)' not in text[queue_segment_start:queue_segment_end]:
                  old = '    _require_workspace(workspace_id)\n    asset = _require_asset(workspace_id, asset_id)\n'
                  if old not in text[queue_segment_start:]:
                      raise SystemExit('queued scan submission anchor missing')
                  before = text[:queue_segment_start]
                  after = text[queue_segment_start:].replace(
                      old,
                      '    _require_workspace(workspace_id)\n'
                      '    _enforce_scan_submission(workspace_id)\n'
                      '    asset = _require_asset(workspace_id, asset_id)\n',
                      1,
                  )
                  text = before + after

          run_start = text.index('def run_managed_scan')
          run_end = text.index('def enqueue_managed_scan')
          run_segment = text[run_start:run_end]
          if 'except ScanCapacityExceeded as exc:' not in run_segment:
              old = (
                  '    except LookupError as exc:\n'
                  '        raise HTTPException(status_code=404, detail=str(exc)) from exc\n'
                  '    except (AssetScanError, OSError, ValueError) as exc:\n'
              )
              new = (
                  '    except LookupError as exc:\n'
                  '        raise HTTPException(status_code=404, detail=str(exc)) from exc\n'
                  '    except ScanCapacityExceeded as exc:\n'
                  '        raise HTTPException(\n'
                  '            status_code=429,\n'
                  '            detail=str(exc),\n'
                  '            headers={"Retry-After": "1"},\n'
                  '        ) from exc\n'
                  '    except (AssetScanError, OSError, ValueError) as exc:\n'
              )
              if old not in run_segment:
                  raise SystemExit('sync scan capacity exception anchor missing')
              run_segment = run_segment.replace(old, new, 1)
              text = text[:run_start] + run_segment + text[run_end:]

          if '/scan-capacity' not in text:
              anchor = (
                  '@app.get(\n'
                  '    "/api/v1/workspaces/{workspace_id}/scan-jobs",\n'
                  '    response_model=list[ScanJob],\n'
                  ')\n'
              )
              endpoint = (
                  '@app.get(\n'
                  '    "/api/v1/workspaces/{workspace_id}/scan-capacity",\n'
                  '    response_model=ScanCapacity,\n'
                  ')\n'
                  'def get_scan_capacity(\n'
                  '    workspace_id: str,\n'
                  '    _principal: ViewerPrincipal,\n'
                  ') -> ScanCapacity:\n'
                  '    _require_workspace(workspace_id)\n'
                  '    return get_quota_repository().scan_capacity(\n'
                  '        workspace_id=workspace_id,\n'
                  '        limit=settings.workspace_scan_concurrency,\n'
                  '    )\n\n\n'
              ) + anchor
              if anchor not in text:
                  raise SystemExit('scan capacity endpoint anchor missing')
              text = text.replace(anchor, endpoint, 1)
          app.write_text(text)

          middleware = Path('src/cryptohawk/api/middleware.py')
          text = middleware.read_text()
          text = text.replace('if status_code in {401, 403}:', 'if status_code in {401, 403, 429}:')
          middleware.write_text(text)

          test_quotas = Path('tests/test_quotas.py')
          text = test_quotas.read_text()
          text = text.replace(
              '    url, inventory, quota, queue, alpha, alpha_asset = _inventory(tmp_path)\n',
              '    _, inventory, _quota, queue, alpha, alpha_asset = _inventory(tmp_path)\n',
          )
          text = text.replace('    assert url.startswith("sqlite:///")\n\n\n', '\n\n')
          test_quotas.write_text(text)

          env = Path('.env.example')
          text = env.read_text()
          additions = (
              'CRYPTOHAWK_PRINCIPAL_REQUESTS_PER_MINUTE=600\n'
              'CRYPTOHAWK_WORKSPACE_REQUESTS_PER_MINUTE=300\n'
              'CRYPTOHAWK_LOGIN_ATTEMPTS_PER_15_MINUTES=10\n'
              'CRYPTOHAWK_BOOTSTRAP_ATTEMPTS_PER_HOUR=5\n'
              'CRYPTOHAWK_SCAN_SUBMISSIONS_PER_MINUTE=30\n'
              'CRYPTOHAWK_WORKSPACE_SCAN_CONCURRENCY=4\n'
          )
          if 'CRYPTOHAWK_PRINCIPAL_REQUESTS_PER_MINUTE' not in text:
              text = text.rstrip() + '\n' + additions
          env.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          if '  workflow_dispatch:\n' not in text:
              anchor = '  pull_request:\n'
              if anchor not in text:
                  raise SystemExit('CI trigger anchor missing')
              text = text.replace(anchor, anchor + '  workflow_dispatch:\n', 1)
          ci.write_text(text)

          # Remove every branch-only helper from the exact product head.
          for helper in (
              '.github/workflows/quota-integration-bootstrap.yml',
              '.github/workflows/quota-test-cleanup.yml',
              '.github/workflows/quota-finalizer.yml',
          ):
              Path(helper).unlink(missing_ok=True)

          required = (
              'src/cryptohawk/storage/quotas.py',
              'migrations/versions/0003_request_quotas_and_scan_capacity.py',
              'tests/test_quotas.py',
              'tests/test_api_quotas.py',
          )
          for item in required:
              if not Path(item).exists():
                  raise SystemExit(f'missing required quota artifact: {item}')
          if 'concurrency_limit' not in Path('src/cryptohawk/storage/queue.py').read_text():
              raise SystemExit('queue concurrency integration missing')
          if 'require_scan_slot' not in Path('src/cryptohawk/services/scan_jobs.py').read_text():
              raise SystemExit('synchronous scan capacity integration missing')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "finalize shared quota enforcement"
            git push origin HEAD:agent/quotas-concurrency
          fi
      - name: Dispatch normal CI on exact product head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="agent/quotas-concurrency"
          head_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --repo "$repo" --ref "$branch"
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$repo" --workflow ci.yml --branch "$branch" --event workflow_dispatch --commit "$head_sha" --limit 10 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "No exact-head CI run found for $head_sha" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$repo" --exit-status
      - name: Mark quota market-readiness gate and revalidate exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/MARKET_READINESS.md')
          text = path.read_text()
          old = '- [ ] Rate limits, request quotas, and scan concurrency controls'
          new = '- [x] Rate limits, request quotas, and scan concurrency controls'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('market-readiness quota gate not found')
          PY
          git add docs/MARKET_READINESS.md
          if ! git diff --cached --quiet; then
            git commit -m "mark shared quota gate complete"
            git push origin HEAD:agent/quotas-concurrency
          fi
          repo="$GITHUB_REPOSITORY"
          branch="agent/quotas-concurrency"
          head_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --repo "$repo" --ref "$branch"
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$repo" --workflow ci.yml --branch "$branch" --event workflow_dispatch --commit "$head_sha" --limit 10 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "No final exact-head CI run found for $head_sha" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$repo" --exit-status
      - name: Squash merge exact green PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="agent/quotas-concurrency"
          head_sha="$(git rev-parse HEAD)"
          pr_number="$(gh pr list --repo "$repo" --head "$branch" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "Open quota PR not found" >&2
            exit 1
          fi
          remote_head="$(gh pr view "$pr_number" --repo "$repo" --json headRefOid --jq .headRefOid)"
          if [ "$remote_head" != "$head_sha" ]; then
            echo "PR head moved after exact-head CI" >&2
            exit 1
          fi
          gh pr merge "$pr_number" --repo "$repo" --squash --match-head-commit "$head_sha"
