services:
  db:
    environment:
      POSTGRES_PASSWORD: ${CRYPTOHAWK_POSTGRES_PASSWORD:?set CRYPTOHAWK_POSTGRES_PASSWORD}

  migrate:
    environment:
      CRYPTOHAWK_ENVIRONMENT: production
      CRYPTOHAWK_DATABASE_URL: ${CRYPTOHAWK_DATABASE_URL:?set CRYPTOHAWK_DATABASE_URL}
      CRYPTOHAWK_CORS_ORIGINS: ${CRYPTOHAWK_CORS_ORIGINS:-}
      CRYPTOHAWK_ALLOW_LEGACY_GLOBAL_API: "false"
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: "false"
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS:?set CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS}
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION:-1}

  api:
    environment:
      CRYPTOHAWK_ENVIRONMENT: production
      CRYPTOHAWK_DATABASE_URL: ${CRYPTOHAWK_DATABASE_URL:?set CRYPTOHAWK_DATABASE_URL}
      CRYPTOHAWK_CORS_ORIGINS: ${CRYPTOHAWK_CORS_ORIGINS:-}
      CRYPTOHAWK_ALLOW_PRIVATE_TARGETS: ${CRYPTOHAWK_ALLOW_PRIVATE_TARGETS:-false}
      CRYPTOHAWK_ALLOW_LEGACY_GLOBAL_API: "false"
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: "false"
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS:?set CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS}
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION:-1}
      CRYPTOHAWK_CONTAINER_ARCHIVE_ROOT: /var/lib/cryptohawk/images
      CRYPTOHAWK_OTEL_TRACES_ENDPOINT: ${CRYPTOHAWK_OTEL_TRACES_ENDPOINT:-}

  worker:
    environment:
      CRYPTOHAWK_ENVIRONMENT: production
      CRYPTOHAWK_DATABASE_URL: ${CRYPTOHAWK_DATABASE_URL:?set CRYPTOHAWK_DATABASE_URL}
      CRYPTOHAWK_CORS_ORIGINS: ${CRYPTOHAWK_CORS_ORIGINS:-}
      CRYPTOHAWK_ALLOW_PRIVATE_TARGETS: ${CRYPTOHAWK_ALLOW_PRIVATE_TARGETS:-false}
      CRYPTOHAWK_ALLOW_LEGACY_GLOBAL_API: "false"
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: "false"
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS:?set CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS}
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION:-1}
      CRYPTOHAWK_CONTAINER_ARCHIVE_ROOT: /var/lib/cryptohawk/images
      CRYPTOHAWK_OTEL_TRACES_ENDPOINT: ${CRYPTOHAWK_OTEL_TRACES_ENDPOINT:-}

  scheduler:
    environment:
      CRYPTOHAWK_ENVIRONMENT: production
      CRYPTOHAWK_DATABASE_URL: ${CRYPTOHAWK_DATABASE_URL:?set CRYPTOHAWK_DATABASE_URL}
      CRYPTOHAWK_CORS_ORIGINS: ${CRYPTOHAWK_CORS_ORIGINS:-}
      CRYPTOHAWK_ALLOW_LEGACY_GLOBAL_API: "false"
      CRYPTOHAWK_AUTO_CREATE_SCHEMA: "false"
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS:?set CRYPTOHAWK_CONNECTOR_ENCRYPTION_KEYS}
      CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION: ${CRYPTOHAWK_CONNECTOR_ENCRYPTION_ACTIVE_VERSION:-1}
      CRYPTOHAWK_OTEL_TRACES_ENDPOINT: ${CRYPTOHAWK_OTEL_TRACES_ENDPOINT:-}
